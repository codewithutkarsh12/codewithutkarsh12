name: Refresh animated profile cards

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Verify profile card generation
        run: python -m unittest discover -s tests -v

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          else
            echo "No profile card changes."
          fi
