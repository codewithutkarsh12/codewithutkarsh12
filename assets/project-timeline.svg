 <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#315bff"/><stop offset=".55" stop-color="#8ea7ff"/><stop offset="1" stop-color="#e98262"/></linearGradient>
 <style>
 .eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;fill:#a9b4ce}.name{font:600 20px Arial,Helvetica,sans-serif;fill:#f3f2ee}.copy{font:13px Arial,Helvetica,sans-serif;fill:#c5cde0}.date{font:11px ui-monospace,monospace;fill:#8ea7ff}.tag{font:10px ui-monospace,monospace;letter-spacing:1px;fill:#a9b4ce}.line{stroke:url(#path);stroke-width:3;stroke-dasharray:7 10;animation:travel 12s linear infinite}.node{fill:#101522;stroke:#8ea7ff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}.n2{animation-delay:1s}.n3{animation-delay:2s}@keyframes travel{to{stroke-dashoffset:-170}}@keyframes pulse{0%,100%{opacity:.7;transform:scale(.9)}50%{opacity:1;transform:scale(1.13)}}@media(prefers-reduced-motion:reduce){.line,.node{animation:none}}
 </style>
