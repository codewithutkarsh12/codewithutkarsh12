<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">What Utkarsh is exploring</title><desc id="desc">Three connected focus areas: software engineering, applied AI and product building.</desc>
<defs><linearGradient id="orbitLine"><stop stop-color="#315bff"/><stop offset=".55" stop-color="#8ea7ff"/><stop offset="1" stop-color="#e98262"/></linearGradient><radialGradient id="core"><stop stop-color="#315bff" stop-opacity=".38"/><stop offset="1" stop-color="#315bff" stop-opacity="0"/></radialGradient><style>
.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;fill:#a9b4ce}.heading{font:600 20px Arial,Helvetica,sans-serif;fill:#f3f2ee}.caption{font:12px ui-monospace,monospace;fill:#a9b4ce}.orbit{fill:none;stroke:url(#orbitLine);stroke-width:1.7;stroke-dasharray:7 11;animation:orbitDash 14s linear infinite}.ring{fill:none;stroke:#91a7ff;stroke-opacity:.24;stroke-width:1}.node{transform-box:fill-box;transform-origin:center;animation:nodePulse 3.6s ease-in-out infinite}.node2{animation-delay:1.2s}.node3{animation-delay:2.4s}.beam{stroke-dasharray:5 10;animation:beam 8s linear infinite}@keyframes orbitDash{to{stroke-dashoffset:-144}}@keyframes nodePulse{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}@keyframes beam{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.orbit,.node,.beam{animation:none}}
</style></defs>
<rect width="1200" height="260" rx="20" fill="#101522"/><circle cx="600" cy="130" r="150" fill="url(#core)"/><path d="M70 130H1130" stroke="#91a7ff" stroke-opacity=".13"/>
