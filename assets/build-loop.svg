<g fill="none" stroke="#f3f2ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M87 112l8-10 8 10-8 10z"/><path d="M256 105h14M256 112h14M256 119h9"/><path d="M424 105h14v14h-14zM427 109h8M427 113h8"/><path d="M592 105h14v14h-14zM596 101v4M602 101v4"/><path d="M760 112l5 5 10-12"/><path d="M928 105h14v14h-14zM931 109h8M931 113h5"/><path d="M1098 112l5 5 10-12"/></g><circle cx="95" cy="112" r="34" class="halo"/><circle cx="95" cy="112" r="5" class="signal"/>
<g text-anchor="middle"><text x="95" y="165" class="label">Understand</text><text x="95" y="188" class="sub">THE PROBLEM</text><text x="263" y="165" class="label">Plan</text><text x="263" y="188" class="sub">THE SCOPE</text><text x="431" y="165" class="label">Prototype</text><text x="431" y="188" class="sub">EXPLORE</text><text x="599" y="165" class="label">Build</text><text x="599" y="188" class="sub">IMPLEMENT</text><text x="767" y="165" class="label">Test</text><text x="767" y="188" class="sub">CHECK</text><text x="935" y="165" class="label">Review</text><text x="935" y="188" class="sub">IMPROVE</text><text x="1105" y="165" class="label">Ship</text><text x="1105" y="188" class="sub">SHARE</text></g>
<path d="M40 220H1160" stroke="#8ea7ff" stroke-opacity=".22"/><text x="40" y="245" fill="#a9b4ce" font-family="ui-monospace,monospace" font-size="11">AI HELPS ME MOVE FASTER.</text><text x="1160" y="245" text-anchor="end" fill="#a9b4ce" font-family="ui-monospace,monospace" font-size="11">TESTING AND REVIEW KEEP THE WORK GROUNDED.</text></svg>