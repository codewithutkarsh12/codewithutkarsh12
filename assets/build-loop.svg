<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">How I build</title><desc id="desc">A seven-step workflow: understand, plan, prototype, build, test, review and ship.</desc>
<defs><linearGradient id="flowGradient"><stop stop-color="#315bff"/><stop offset=".52" stop-color="#8ea7ff"/><stop offset="1" stop-color="#e98262"/></linearGradient><filter id="softGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.label{font:600 19px Arial,Helvetica,sans-serif;fill:#f3f2ee}.sub{font:11px ui-monospace,monospace;fill:#a9b4ce}.node{fill:#111827;stroke:#52628a;stroke-width:1.5;opacity:0;animation:appear .7s ease-out forwards}.node:nth-of-type(2){animation-delay:.15s}.node:nth-of-type(3){animation-delay:.3s}.node:nth-of-type(4){animation-delay:.45s}.node:nth-of-type(5){animation-delay:.6s}.node:nth-of-type(6){animation-delay:.75s}.node:nth-of-type(7){animation-delay:.9s}.accent{fill:#17264d;stroke:#8ea7ff;stroke-width:1.8}.flow{fill:none;stroke:url(#flowGradient);stroke-width:3;stroke-linecap:round;stroke-dasharray:3 13;animation:dash 7s linear infinite}.signal{fill:#fff;filter:url(#softGlow);animation:signal 7s ease-in-out infinite}.halo{fill:none;stroke:#8ea7ff;stroke-opacity:.35;animation:halo 2.8s ease-out infinite}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes dash{to{stroke-dashoffset:-128}}@keyframes signal{0%{transform:translateX(0)}100%{transform:translateX(1010px)}}@keyframes halo{0%{r:25;opacity:.7}100%{r:43;opacity:0}}@media(prefers-reduced-motion:reduce){.node,.flow,.signal,.halo{animation:none;opacity:1}}
</style></defs>
<rect width="1200" height="270" rx="20" fill="#101522"/><text x="40" y="42" fill="#a9b4ce" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">A PRACTICAL BUILD LOOP</text><text x="1160" y="42" text-anchor="end" fill="#a9b4ce" font-family="ui-monospace,monospace" font-size="11">AI-ASSISTED · HUMAN-REVIEWED</text>
