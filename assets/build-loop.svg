<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">The engineering loop</title><desc id="desc">Idea, Plan, Prompt, Build, Test, Review and Ship connected by a moving signal.</desc>
<defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#315bff"/><stop offset=".55" stop-color="#8ea7ff"/><stop offset="1" stop-color="#e98262"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
