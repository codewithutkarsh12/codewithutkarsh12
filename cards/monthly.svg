n-delay:0.56s"/><text x="444.0" y="244" text-anchor="middle" class="mono muted" font-size="9">Aug</text><rect x="476" y="219.0" width="34" height="3.0" rx="4" fill="#111111" class="rise" style="animation-delay:0.63s"/><text x="493.0" y="244" text-anchor="middle" class="mono muted" font-size="9">Sep</text><rect x="525" y="219.0" width="34" height="3.0" rx="4" fill="#111111" class="rise" style="animation-delay:0.70s"/><text x="542.0" y="244" text-anchor="middle" class="mono muted" font-size="9">Oct</text><rect x="574" y="219.0" width="34" height="3.0" rx="4" fill="#111111" class="rise" style="animation-delay:0.77s"/><text x="591.0" y="244" text-anchor="middle" class="mono muted" font-size="9">Nov</text><path d="M500 28V263" stroke="#deded9"/><text x="525" y="57" class="serif ink" font-size="28">—</text><text x="527" y="74" class="sans muted" font-size="11">current streak</text><path d="M525 85H725" stroke="#deded9"/><text x="525" y="110" class="serif ink" font-size="28">—</text><text x="527" y="127" class="sans muted" font-size="11">longest streak</text><path d="M525 138H725" stroke="#deded9"/><text x="525" y="163" class="serif ink" font-size="28">—</text><text x="527" y="180" class="sans muted" font-size="11">days with a contribution</text><path d="M525 191H725" stroke="#deded9"/><text x="525" y="216" class="serif ink" font-size="28">—</text><text x="527" y="233" class="sans muted" font-size="11">on the busiest day</text></svg>