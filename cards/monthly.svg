<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="t"><title id="t">The last 12 months on GitHub</title><defs><linearGradient id="shine"><stop offset="0" stop-color="#315bff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#315bff" stop-opacity="0"/></linearGradient><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,monospace}.ink{fill:#111}.muted{fill:#777}.blue{fill:#315bff}.enter{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .8s ease both}.tile{transform-box:fill-box;transform-origin:center bottom;animation:tileIn .9s cubic-bezier(.18,.9,.25,1.2) both}.sweep{animation:sweep 5s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{from{transform:scaleY(.02);opacity:.35}to{transform:scaleY(1);opacity:1}}@keyframes tileIn{0%{opacity:0;transform:translateY(32px) rotate(2deg)}70%{opacity:1;transform:translateY(-4px) rotate(-.5deg)}100%{transform:translateY(0) rotate(0)}}@keyframes sweep{0%,70%{transform:translateX(-160%)}100%{transform:translateX(160%)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></defs><rect width="760" height="290" rx="18" fill="#f3f2ee"/><text x="34" y="38" class="mono muted" font-size="10" letter-spacing="1.3">THE LAST 12 MONTHS ON GITHUB</text><text x="34" y="87" class="serif ink" font-size="39">Awaiting data</text><rect x="35" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0s"/> <text x="52" y="244" text-anchor="middle" class="mono muted" font-size="9">Dec</text><rect x="84" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.07s"/> <text x="101" y="244" text-anchor="middle" class="mono muted" font-size="9">Jan</text><rect x="133" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.14s"/> <text x="150" y="244" text-anchor="middle" class="mono muted" font-size="9">Feb</text><rect x="182" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.21000000000000002s"/> <text x="199" y="244" text-anchor="middle" class="mono muted" font-size="9">Mar</text><rect x="231" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.28s"/> <text x="248" y="244" text-anchor="middle" class="mono muted" font-size="9">Apr</text><rect x="280" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.35000000000000003s"/> <text x="297" y="244" text-anchor="middle" class="mono muted" font-size="9">May</text><rect x="329" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.42000000000000004s"/> <text x="346" y="244" text-anchor="middle" class="mono muted" font-size="9">Jun</text><rect x="378" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.49000000000000005s"/> <text x="395" y="244" text-anchor="middle" class="mono muted" font-size="9">Jul</text><rect x="427" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.56s"/> <text x="444" y="244" text-anchor="middle" class="mono muted" font-size="9">Aug</text><rect x="476" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.6300000000000001s"/> <text x="493" y="244" text-anchor="middle" class="mono muted" font-size="9">Sep</text><rect x="525" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.7000000000000001s"/> <text x="542" y="244" text-anchor="middle" class="mono muted" font-size="9">Oct</text><rect x="574" y="219" width="34" height="3" rx="4" fill="#c9c9c4" class="rise" style="animation-delay:0.77s"/> <text x="591" y="244" text-anchor="middle" class="mono muted" font-size="9">Nov</text><path d="M500 28V263" stroke="#deded9"/><text x="525" y="57" class="serif ink" font-size="28">—</text><text x="527" y="74" class="sans muted" font-size="11">current streak</text><path d="M525 85H725" stroke="#deded9"/><text x="525" y="110" class="serif ink" font-size="28">—</text><text x="527" y="127" class="sans muted" font-size="11">longest streak</text><path d="M525 138H725" stroke="#deded9"/><text x="525" y="163" class="serif ink" font-size="28">—</text><text x="527" y="180" class="sans muted" font-size="11">days with a contribution</text><path d="M525 191H725" stroke="#deded9"/><text x="525" y="216" class="serif ink" font-size="28">—</text><text x="527" y="233" class="sans muted" font-size="11">on the busiest day</text></svg>