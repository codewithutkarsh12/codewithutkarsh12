<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170" role="img" aria-labelledby="t"><title id="t">CampusResolve AI</title><defs><linearGradient id="shine"><stop offset="0" stop-color="#315bff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#315bff" stop-opacity="0"/></linearGradient><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,monospace}.ink{fill:#111}.muted{fill:#777}.blue{fill:#315bff}.enter{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .8s ease both}.tile{transform-box:fill-box;transform-origin:center bottom;animation:tileIn .9s cubic-bezier(.18,.9,.25,1.2) both}.sweep{animation:sweep 5s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{from{transform:scaleY(.02);opacity:.35}to{transform:scaleY(1);opacity:1}}@keyframes tileIn{0%{opacity:0;transform:translateY(32px) rotate(2deg)}70%{opacity:1;transform:translateY(-4px) rotate(-.5deg)}100%{transform:translateY(0) rotate(0)}}@keyframes sweep{0%,70%{transform:translateX(-160%)}100%{transform:translateX(160%)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></defs><rect width="360" height="170" rx="18" fill="#f3f2ee"/><g class="enter" style="animation-delay:0.2s"><rect width="360" height="170" rx="15" fill="#f3f2ee" stroke="#deded9"/><rect x="20" y="22" width="7" height="7" rx="2" fill="#ef382c"/><text x="38" y="30" class="sans ink" font-size="16" font-weight="600">CampusResolve AI</text><text x="20" y="69" class="sans" fill="#555" font-size="12">AI-assisted campus incident</text><text x="20" y="87" class="sans" fill="#555" font-size="12">triage and resolution workflows.</text><text x="20" y="143" class="mono muted" font-size="10">Applied AI · Product</text><path d="M320 24h12m-5 -5l5 5l-5 5" fill="none" stroke="#ef382c" stroke-width="1.4"/></g></svg>