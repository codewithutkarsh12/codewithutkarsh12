<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="title desc"><title id="title">LEARN</title><desc id="desc">Automatically generated GitHub profile activity card.</desc><defs><linearGradient id="shine"><stop offset="0" stop-color="#315bff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#315bff" stop-opacity="0"/></linearGradient><style>
.serif{font-family:Georgia, 'Times New Roman', serif}.sans{font-family:Arial, Helvetica, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.ink{fill:#111111}.muted{fill:#77777b}.blue{fill:#315bff}
.enter{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.tile{transform-box:fill-box;transform-origin:center bottom;animation:tileIn .9s cubic-bezier(.18,.9,.25,1.2) both}.sweep{animation:sweep 5s ease-in-out infinite}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{from{transform:scaleY(.02);opacity:.35}to{transform:scaleY(1);opacity:1}}@keyframes tileIn{0%{opacity:0;transform:translateY(32px) rotate(2deg)}70%{opacity:1;transform:translateY(-4px) rotate(-.5deg)}100%{transform:translateY(0) rotate(0)}}@keyframes sweep{0%,70%{transform:translateX(-160%)}100%{transform:translateX(160%)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></defs><rect width="240" height="180" rx="18" fill="#f3f2ee"/><g class="tile" style="animation-delay:0.4s"><rect width="240" height="180" rx="15" fill="#ffc928"/><text x="20" y="28" class="mono" fill="#151515" font-size="10" letter-spacing="1.4">LEARN</text><text x="20" y="87" class="serif" fill="#151515" font-size="30" font-style="italic">Engineering</text><text x="20" y="119" class="sans" fill="#151515" font-size="12">Fundamentals, craft</text><text x="20" y="137" class="sans" fill="#151515" font-size="12">&amp; constant learning</text><text x="214" y="28" class="sans" fill="#151515" font-size="17">↗</text><rect width="240" height="180" rx="15" fill="url(#shine)" opacity=".24" class="sweep"/></g></svg>